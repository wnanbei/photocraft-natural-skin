[package]
name = "natural-skin-core"
version = "1.1.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["NanBei.W"]
description = "Native Natural Skin retouching core and preview cache"
repository = "https://github.com/wnanbei/photocraft-natural-skin"
homepage = "https://github.com/wnanbei/photocraft-natural-skin"
readme = "README.md"
keywords = ["photocraft", "retouching", "skin", "native", "image-processing"]
categories = ["multimedia::images"]
publish = false

[workspace]
members = ["native"]
default-members = [".", "native"]
resolver = "3"

[lib]
crate-type = ["rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
