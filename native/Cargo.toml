[package]
name = "natural-skin-companion"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[dependencies]
natural-skin-core = { path = ".." }
serde_json = "=1.0.151"
tiff = "=0.11.3"
zip = { version = "=9.4.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
blake3 = { version = "=1.8.7", default-features = false, features = ["pure", "std"] }
ruzstd = "=0.9.1"
moxcms = { version = "=0.8.1", features = ["extended_range"] }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit", "system_fonts"], optional = true }
rfd = { version = "=0.17.2", optional = true }

[features]
gui = ["dep:eframe", "dep:rfd", "dep:fmv-macos-events"]

[target.'cfg(target_os = "macos")'.dependencies]
fmv-macos-events = { version = "=0.1.0", optional = true }

[[bin]]
name = "natural-skin-companion"
path = "src/main.rs"

[[bin]]
name = "natural-skin"
path = "src/gui.rs"
required-features = ["gui"]
