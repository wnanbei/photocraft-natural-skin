name: Feature request / 功能建议
description: Suggest a concrete improvement to the retouching workflow.
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow and problem / 使用场景与问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour / 希望的行为
    validations:
      required: true
