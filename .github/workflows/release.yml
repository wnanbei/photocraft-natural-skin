name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release version and changelog
        run: |
          node scripts/version.mjs check --tag "$GITHUB_REF_NAME" --release
          node --test tests/version.test.mjs
      - name: Install Rust components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Check source
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked --offline -- -D warnings
          cargo clippy --target wasm32-unknown-unknown --locked --offline -- -D warnings
          cargo test --locked --offline
      - name: Build and test plugin
        run: |
          cargo build --release --locked --offline --target wasm32-unknown-unknown
          node tests/verify.mjs
      - name: Check tag, manifest and package
        run: node scripts/package.mjs "$GITHUB_REF_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          options=(--verify-tag --title "Natural Skin $GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md)
          if [[ "$(node scripts/version.mjs channel)" == "prerelease" ]]; then
            options+=(--prerelease --latest=false)
          else
            options+=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${options[@]}"
