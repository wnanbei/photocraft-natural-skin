name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check version consistency and release tooling
        run: |
          node scripts/version.mjs check
          node --test tests/version.test.mjs
      - name: Install Rust components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint native and WebAssembly builds
        run: |
          cargo clippy --all-targets --locked --offline -- -D warnings
          cargo clippy --target wasm32-unknown-unknown --locked --offline -- -D warnings
      - name: Test native kernel
        run: cargo test --locked --offline
      - name: Build WebAssembly plugin
        run: cargo build --release --locked --offline --target wasm32-unknown-unknown
      - name: Test compiled plugin
        run: node tests/verify.mjs
      - name: Validate and package
        run: node scripts/package.mjs
      - name: Upload plugin and report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: natural-skin-wasm
          path: |
            dist/
            test-output/verification.json
          if-no-files-found: error
          retention-days: 14
